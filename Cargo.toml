[workspace]
resolver = "3"
members = ["crates/*", "tests", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# The minimum supported Rust version is the pinned toolchain in
# `rust-toolchain.toml`. CI tests no older compiler.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nomux-sh/nomux"
homepage = "https://nomux.sh"
authors = ["The nomux Authors"]
# No crate of this workspace is published to crates.io yet.
publish = false

[workspace.dependencies]
nomux-client = { path = "crates/nomux-client", version = "0.2.0" }
nomux-core = { path = "crates/nomux-core", version = "0.2.0" }
nomux-holder-protocol = { path = "crates/nomux-holder-protocol", version = "0.2.0" }
nomux-term = { path = "crates/nomux-term", version = "0.2.0" }
nomux-transport = { path = "crates/nomux-transport", version = "0.2.0" }

base64 = "0.22.1"
clap = { version = "4.6.10", features = ["derive"] }
getrandom = "0.4.3"
hmac = "0.13.0"
libc = "0.2.191"
# The safe encoder and the safe decoder, without the frame format: the journal has
# its own framing.
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
nomux-extension = { version = "0.1.0", features = ["manifest"] }
nomux-proto = "0.3.0"
prost = "0.14.6"
# The SSH client. The `ring` backend has a license that `deny.toml` permits;
# the default backend (`aws-lc-rs`) does not. Without `flate2`: no compression.
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
rustix = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.2"
signal-hook = { version = "0.4.6", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false }
toml = { version = "1.2.3", default-features = false, features = ["std", "parse", "display", "serde"] }
toml_edit = { version = "0.25.21", default-features = false, features = ["parse", "display"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

# Lint policy. Each crate opts in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, thus each `warn` below fails the build.
# `deny` is for rules that must also fail a local `cargo build` or `cargo check`.
[workspace.lints.rust]
# Each unsafe operation must be in its own `unsafe` block, also inside an `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# No unsafe code by default. A crate that must use it (the holder: `mmap`, `memfd`)
# permits it for each item with `#[expect(unsafe_code)]` and a `SAFETY` comment.
unsafe_code = "deny"
# Each public item has documentation. Each public type can be printed in a log.
missing_docs = "warn"
missing_debug_implementations = "warn"
# An item that is `pub` but not reachable from outside the crate must be `pub(crate)`.
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Each unsafe block has a `SAFETY` comment.
undocumented_unsafe_blocks = "deny"
# No debug output and no unfinished code on `main`.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The holder and the daemon must not stop on a recoverable error.
# `clippy.toml` permits `unwrap` in tests.
unwrap_used = "warn"

# Release profile from the performance architecture: small and fast binaries.
# `panic = "abort"` removes the unwind tables. A panic stops the process.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
