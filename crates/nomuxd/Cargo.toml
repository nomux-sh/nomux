[package]
name = "nomuxd"
description = "The nomux daemon: one process on each host that manages the session holders and serves the clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
nomux-core.workspace = true
nomux-ext-host.workspace = true
nomux-holder-protocol.workspace = true
nomux-proto.workspace = true
nomux-status.workspace = true
nomux-transport.workspace = true
# `mkfifo`: rustix has no call for it on macOS.
nix = { workspace = true, features = ["fs"] }
prost.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
