[package]
name = "nomux-cli"
description = "The nomux command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "nomux"
path = "src/main.rs"

[dependencies]
clap.workspace = true
nomux-client.workspace = true
nomux-core.workspace = true
rustix = { workspace = true, features = ["termios"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "signal", "sync"] }

[dev-dependencies]
rustix = { workspace = true, features = ["fs", "pty"] }

[lints]
workspace = true
