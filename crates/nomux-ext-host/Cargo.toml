[package]
name = "nomux-ext-host"
description = "Daemon-side extension host of nomux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
# `tests/test_extension` is a binary target, not a test.
autotests = false

# The extension of the integration tests. It is a binary target because
# Cargo gives the path of a binary to the tests of its package.
[[bin]]
name = "nomux-test-extension"
path = "tests/test_extension/main.rs"
test = false
doc = false

[[test]]
name = "extension_host"
path = "tests/extension_host/main.rs"

[dependencies]
nomux-extension.workspace = true
prost.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
