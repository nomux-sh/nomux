[package]
name = "nomux-end-to-end"
description = "End-to-end tests of the nomux core: the real nomux, nomuxd and nomux-holder binaries together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "support/lib.rs"
test = false
doctest = false

# A test starts this program in the place of a daemon: Cargo gives a test
# the path of a binary of its own package.
[[bin]]
name = "nomux-test-incompatible-daemon"
path = "support/incompatible_daemon.rs"
test = false

# The command of a session in a test of the memory of a session.
[[bin]]
name = "nomux-test-memory-user"
path = "support/memory_user.rs"

# A test starts this program as the command of a session: it reports its
# status with OSC 7501.
[[bin]]
name = "nomux-test-status-program"
path = "support/status_program.rs"
test = false

# A test installs this program as the adapter extension of the made-up
# tool `testtool`.
[[bin]]
name = "nomux-test-adapter"
path = "support/test_adapter.rs"
test = false

[[example]]
name = "attach_measurements"
path = "measurements/attach.rs"

[[example]]
name = "hook_measurements"
path = "measurements/hooks.rs"

[[example]]
name = "memory_measurements"
path = "measurements/memory.rs"

[[example]]
name = "new_session_measurements"
path = "measurements/new_session.rs"

[[example]]
name = "remote_measurements"
path = "measurements/remote.rs"

[[example]]
name = "restore_measurements"
path = "measurements/restore.rs"

[[test]]
name = "attach"
path = "attach.rs"

[[test]]
name = "adapters"
path = "adapters.rs"

[[test]]
name = "attach_protocol"
path = "attach_protocol.rs"

[[test]]
name = "daemon_service"
path = "daemon_service.rs"

[[test]]
name = "extensions"
path = "extensions.rs"

[[test]]
name = "holder_pool"
path = "holder_pool.rs"

[[test]]
name = "journal"
path = "journal.rs"

[[test]]
name = "process_cleanup"
path = "process_cleanup.rs"

[[test]]
name = "remote_host"
path = "remote_host.rs"

[[test]]
name = "restore"
path = "restore.rs"

[[test]]
name = "session_memory"
path = "session_memory.rs"

[[test]]
name = "session_lifecycle"
path = "session_lifecycle.rs"

[[test]]
name = "single_writer_lease"
path = "single_writer_lease.rs"

[[test]]
name = "status"
path = "status.rs"

[[test]]
name = "table_width"
path = "table_width.rs"

[[test]]
name = "version_mismatch"
path = "version_mismatch.rs"

[dependencies]
nomux-core.workspace = true
nomux-extension.workspace = true
nomux-holder-protocol.workspace = true
nomux-proto.workspace = true
nomux-term.workspace = true
prost.workspace = true
rustix = { workspace = true, features = ["fs", "process", "pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
base64.workspace = true
nomux-client.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
