[package]
name = "nomux-end-to-end"
description = "End-to-end tests of the nomux core: the real nomux, nomuxd and nomux-holder binaries together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "support/lib.rs"
test = false
doctest = false

[[example]]
name = "attach_measurements"
path = "measurements/attach.rs"

[[test]]
name = "attach"
path = "attach.rs"

[[test]]
name = "attach_protocol"
path = "attach_protocol.rs"

[[test]]
name = "session_lifecycle"
path = "session_lifecycle.rs"

[[test]]
name = "single_writer_lease"
path = "single_writer_lease.rs"

[[test]]
name = "version_mismatch"
path = "version_mismatch.rs"

[dependencies]
nomux-holder-protocol.workspace = true
nomux-term.workspace = true
rustix = { workspace = true, features = ["fs", "process", "pty", "termios"] }
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
nomux-client.workspace = true
nomux-proto.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
