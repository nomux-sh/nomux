[package]
name = "nomux-end-to-end"
description = "End-to-end tests of the nomux core: the real nomux, nomuxd and nomux-holder binaries together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
path = "support/lib.rs"
test = false
doctest = false

[[test]]
name = "session_lifecycle"
path = "session_lifecycle.rs"

[[test]]
name = "single_writer_lease"
path = "single_writer_lease.rs"

[[test]]
name = "version_mismatch"
path = "version_mismatch.rs"

[dependencies]
nomux-holder-protocol.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
nomux-proto.workspace = true
prost.workspace = true

[lints]
workspace = true
