name: Release build

# Builds the static Linux release archive when a pull request changes the
# dependencies or the release tools. The checks in ci.yml do not build for
# musl, thus a dependency that needs a C compiler for musl would be found
# only at the next version tag.

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - rust-toolchain.toml
      - scripts/build-release.sh
      - scripts/package-archive.sh
      - scripts/check-archive.sh
      - .github/workflows/release.yml
      - .github/workflows/release-build.yml

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux-musl:
    name: release build (linux musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install the C compiler for musl
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-musl
      - name: Build, package and check the archive
        run: scripts/build-release.sh x86_64-unknown-linux-musl
