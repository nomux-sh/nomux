name: Release

# A version tag builds `nomux`, `nomuxd` and `nomux-holder` for four targets
# and makes the GitHub release with one archive for each target. A manual run
# with `dry-run` builds the same archives as workflow artifacts and makes no
# release. The steps for a maintainer are in
# https://github.com/nomux-sh/.github/blob/main/RELEASING.md

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build the archives as workflow artifacts. Create no release.
        type: boolean
        default: true

permissions:
  contents: read

# A second run for the same tag waits. A release is not cancelled in the
# middle of an upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `true` when the run makes a release. The condition of the `github-release`
  # job is the same expression.
  RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check of the `main` branch reads the history.
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Read the workspace version
        id: version
        run: |
          version="$(scripts/workspace-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is equal to the workspace version
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::A release needs the tag v$VERSION. This run is for the $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Check that the commit is on main
        if: env.RELEASE == 'true'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The commit of $GITHUB_REF_NAME is not on the main branch."
            exit 1
          fi
      - name: Check that the changelog has the section of the version
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-nextest@0.9.152
      - name: cargo nextest
        run: cargo nextest run --workspace --locked
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

  # Each Linux target has a runner with its own processor type. One macOS
  # runner builds the two Apple targets, because the wait for a macOS runner
  # is longer than the builds. Thus no cross-compilation tool is necessary.
  # The build has no cache: a release starts from the sources only.
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: macos
            runner: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
    env:
      TARGETS: ${{ matrix.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install the C compiler for musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build, package and check each target
        run: |
          for target in $TARGETS; do
            echo "::group::$target"
            scripts/build-release.sh "$target"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives-${{ matrix.name }}
          path: target/dist/nomux-*.tar.gz
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum nomux-*.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [check, checksums]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A version earlier than 1.0.0 or with a suffix is a pre-release.
          flags=()
          case "$VERSION" in
            0.* | *-*) flags+=(--prerelease) ;;
          esac
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" \
            dist/nomux-*.tar.gz dist/SHA256SUMS
