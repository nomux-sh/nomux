name: CI

# The jobs call the reusable workflows of the organization. The steps are in
# https://github.com/nomux-sh/.github/tree/main/.github/workflows

on:
  pull_request:
  schedule:
    # Each day at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: Linux and macOS. The holder has code for each host, and
  # only a run on macOS tests the macOS code.
  rust:
    name: rust
    if: github.event_name == 'pull_request'
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      os: '["ubuntu-latest","macos-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true

  repo-lint:
    name: repo-lint
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: code
      require-changelog: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

  # Pull requests: Linux only. The nightly run adds macOS, where `sh`, `tar`
  # and the checksum tool are not the same programs as on Linux.
  install-script:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" install.sh scripts/*.sh
      - name: Test install.sh
        run: scripts/test-install.sh

  # Nightly and manual runs: Linux and macOS.
  rust-all-hosts:
    name: rust (all hosts)
    if: github.event_name != 'pull_request'
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      os: '["ubuntu-latest","macos-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true
