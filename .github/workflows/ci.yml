name: CI

# The jobs call the reusable workflows of the organization. The steps are in
# https://github.com/nomux-sh/.github/tree/main/.github/workflows

on:
  pull_request:
  schedule:
    # Each day at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests: Linux only, for a fast result. The nightly run adds macOS.
  rust:
    name: rust
    if: github.event_name == 'pull_request'
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      os: '["ubuntu-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true

  repo-lint:
    name: repo-lint
    uses: nomux-sh/.github/.github/workflows/repo-lint.yml@main
    with:
      license: code
      require-changelog: true

  # Nightly and manual runs: Linux and macOS.
  rust-all-hosts:
    name: rust (all hosts)
    if: github.event_name != 'pull_request'
    uses: nomux-sh/.github/.github/workflows/rust-ci.yml@main
    with:
      os: '["ubuntu-latest","macos-latest"]'
      working-directory: .
      run-deny: true
      run-machete: true
