name: Fuzz

# The fuzz targets of the `fuzz` directory. They are not in ci.yml because
# they need a nightly compiler and a path filter.
#
# - Pull requests: 10 seconds for each target, 60 seconds in total, and only
#   if the pull request changes the code that the targets use.
# - Each night: 10 minutes for each target.
#
# A crash fails the job. The input of the crash is in the `fuzz-artifacts`
# artifact of the run.

on:
  pull_request:
  schedule:
    # Each day at 03:47 UTC.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The path filter is a job, not the `paths` key of the trigger. A workflow
  # that `paths` does not start reports no status, and a required check then
  # waits without an end. A job that `if` skips reports success.
  changes:
    name: fuzz paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - name: Find the files of the pull request that the fuzz targets use
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          paths='^(fuzz/|crates/nomux-term/|crates/nomux-holder-protocol/|xtask/|\.github/workflows/fuzz\.yml$)'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/files"
          if grep --quiet --extended-regexp "$paths" "$RUNNER_TEMP/files"; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz:
    name: fuzz
    needs: changes
    # `changes` does not run at night, thus `needs` alone skips this job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuzz == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 90 }}
    env:
      SECONDS_FOR_EACH_TARGET: ${{ github.event_name == 'pull_request' && 10 || 600 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `cargo xtask` uses the toolchain of the core workspace. The targets
      # use the nightly toolchain of the `fuzz` directory.
      - name: Install the toolchains from the two rust-toolchain.toml files
        run: |
          rustup toolchain install
          cd fuzz
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@18101caa61cb89118e2ee749786f33c6d1f8a8cb # v2.90.9
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run each fuzz target
        run: |
          failed=""
          for file in fuzz/fuzz_targets/*.rs; do
            target="$(basename "$file" .rs)"
            echo "::group::$target"
            if ! cargo xtask fuzz "$target" "$SECONDS_FOR_EACH_TARGET"; then
              failed="$failed $target"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::These fuzz targets failed:$failed"
            exit 1
          fi
      - name: Upload the inputs of the crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
